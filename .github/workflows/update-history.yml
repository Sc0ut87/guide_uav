name: Update History

on:
  push:
    paths:
      - 'data.json'

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get previous data.json
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git show HEAD~1:data.json > old_data.json 2>/dev/null || echo "{}" > old_data.json
          else
            echo "{}" > old_data.json
          fi

      - name: Compare and update history
        run: |
          node <<'EOF'
          const fs = require('fs');

          function safeRead(path, fallback) {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch (e) { return fallback; }
          }

          const oldData = safeRead('old_data.json', {});
          const newData = safeRead('data.json', {});
          const historyFile = safeRead('history.json', { history: [] });

          const oldDrones = [...(oldData.ua || []), ...(oldData.ru || [])];
          const newDrones = [...(newData.ua || []), ...(newData.ru || [])];

          const oldMap = new Map(oldDrones.map(d => [d.id, d]));
          const newMap = new Map(newDrones.map(d => [d.id, d]));

          const added = newDrones
            .filter(d => !oldMap.has(d.id))
            .map(d => d.n || d.nr || d.id);

          const removed = oldDrones
            .filter(d => !newMap.has(d.id))
            .map(d => d.n || d.nr || d.id);

          const updated = [];
          
          const baseFieldNames = {
            'n': { uk: 'Назва (укр)', en: 'Name (UK)' },
            'nr': { uk: 'Назва (англ)', en: 'Name (EN)' },
            't': { uk: 'Тип (категорія)', en: 'Type (category)' },
            'tl': { uk: 'Тип (опис)', en: 'Type (description)' },
            'tl_en': { uk: 'Тип (опис EN)', en: 'Type (description EN)' },
            'tg': { uk: 'Теги', en: 'Tags' },
            'r': { uk: 'Дальність', en: 'Range' },
            'r_en': { uk: 'Дальність (EN)', en: 'Range (EN)' },
            'kn': { uk: 'Навантаження', en: 'Payload' },
            'kn_en': { uk: 'Навантаження (EN)', en: 'Payload (EN)' },
            'zm': { uk: 'Маса', en: 'Weight' },
            'zm_en': { uk: 'Маса (EN)', en: 'Weight (EN)' },
            'sp': { uk: 'Швидкість', en: 'Speed' },
            'sp_en': { uk: 'Швидкість (EN)', en: 'Speed (EN)' },
            'w': { uk: 'Розмах крила', en: 'Wingspan' },
            'w_en': { uk: 'Розмах крила (EN)', en: 'Wingspan (EN)' },
            'l': { uk: 'Довжина', en: 'Length' },
            'l_en': { uk: 'Довжина (EN)', en: 'Length (EN)' },
            'y': { uk: 'Рік', en: 'Year' },
            'st': { uk: 'Статус', en: 'Status' },
            'st_en': { uk: 'Статус (EN)', en: 'Status (EN)' },
            'ft': { uk: 'Час польоту', en: 'Flight time' },
            'ft_en': { uk: 'Час польоту (EN)', en: 'Flight time (EN)' },
            'h': { uk: 'Висота', en: 'Altitude' },
            'h_en': { uk: 'Висота (EN)', en: 'Altitude (EN)' },
            'eng': { uk: 'Двигун', en: 'Engine' },
            'eng_en': { uk: 'Двигун (EN)', en: 'Engine (EN)' },
            'mods': { uk: 'Модифікації', en: 'Modifications' },
            'mods_en': { uk: 'Модифікації (EN)', en: 'Modifications (EN)' },
            'd': { uk: 'Опис', en: 'Description' },
            'd_en': { uk: 'Опис (EN)', en: 'Description (EN)' },
            'f': { uk: 'Характеристики', en: 'Features' },
            'f_en': { uk: 'Характеристики (EN)', en: 'Features (EN)' },
            'img': { uk: 'Головне фото', en: 'Main photo' },
            'imgs': { uk: 'Галерея фото', en: 'Photo gallery' },
            'c': { uk: 'Країна', en: 'Country' },
            'i': { uk: 'Іконка', en: 'Icon' }
          };

          newDrones.forEach(newD => {
            const oldD = oldMap.get(newD.id);
            if (!oldD) return;

            const isMarine = newD.tg && newD.tg.includes('m');
            const isGround = newD.tg && (newD.tg.includes('nrk-ua') || newD.tg.includes('nrk-ru'));

            const changedKeys = new Set();
            const allKeys = new Set([...Object.keys(oldD), ...Object.keys(newD)]);

            // 1. Збираємо всі змінені ключі
            allKeys.forEach(key => {
              if (key === 'id') return;

              let oldVal, newVal;
              if (Array.isArray(oldD[key]) || Array.isArray(newD[key])) {
                oldVal = JSON.stringify(oldD[key] || []);
                newVal = JSON.stringify(newD[key] || []);
              } else {
                oldVal = JSON.stringify(oldD[key] || '');
                newVal = JSON.stringify(newD[key] || '');
              }

              if (oldVal !== newVal) {
                changedKeys.add(key);
              }
            });

            // 2. Об'єднуємо пари "поле" + "поле_en"
            const processedPairs = new Set();
            const changedFields = [];

            changedKeys.forEach(key => {
              if (processedPairs.has(key)) return;

              // Якщо це "_en" поле
              if (key.endsWith('_en')) {
                const baseKey = key.slice(0, -3);
                if (changedKeys.has(baseKey)) {
                  // Змінилися ОБИДВА — показуємо один раз з базовою назвою
                  let label = baseFieldNames[baseKey] || { uk: baseKey, en: baseKey };
                  
                  if (isMarine) {
                    if (baseKey === 'r') label = { uk: 'Радіус дії', en: 'Radius of action' };
                    if (baseKey === 'kn') label = { uk: 'Бойова частина', en: 'Warhead' };
                    if (baseKey === 'zm') label = { uk: 'Водотоннажність', en: 'Displacement' };
                    if (baseKey === 'w') label = { uk: 'Ширина / Осадка', en: 'Beam / Draft' };
                    if (baseKey === 'l') label = { uk: 'Довжина корпусу', en: 'Hull length' };
                    if (baseKey === 'ft') label = { uk: 'Час у морі', en: 'Time at sea' };
                    if (baseKey === 'h') label = { uk: 'Висота над водою', en: 'Height above water' };
                  }
                  if (isGround) {
                    if (baseKey === 'r') label = { uk: 'Запас ходу', en: 'Range (endurance)' };
                    if (baseKey === 'kn') label = { uk: 'Вантажопідйомність', en: 'Payload capacity' };
                    if (baseKey === 'zm') label = { uk: 'Маса', en: 'Weight' };
                    if (baseKey === 'w') label = { uk: 'Тип шасі', en: 'Chassis type' };
                    if (baseKey === 'l') label = { uk: 'Габарити (Д×Ш×В)', en: 'Dimensions (L×W×H)' };
                    if (baseKey === 'ft') label = { uk: 'Дальність зв\'язку', en: 'Comm range' };
                    if (baseKey === 'h') label = { uk: 'Кліренс', en: 'Ground clearance' };
                  }

                  changedFields.push(label);
                  processedPairs.add(key);
                  processedPairs.add(baseKey);
                  return;
                }
                // Змінився ТІЛЬКИ _en — показуємо з позначкою "(EN)"
                let labelEn = baseFieldNames[key] || { uk: key, en: key };
                changedFields.push(labelEn);
                processedPairs.add(key);
                return;
              }

              // Базове поле без _en
              const enKey = key + '_en';
              if (changedKeys.has(enKey)) {
                // Змінилися ОБИДВА — показуємо один раз
                let label = baseFieldNames[key] || { uk: key, en: key };
                
                if (isMarine) {
                  if (key === 'r') label = { uk: 'Радіус дії', en: 'Radius of action' };
                  if (key === 'kn') label = { uk: 'Бойова частина', en: 'Warhead' };
                  if (key === 'zm') label = { uk: 'Водотоннажність', en: 'Displacement' };
                  if (key === 'w') label = { uk: 'Ширина / Осадка', en: 'Beam / Draft' };
                  if (key === 'l') label = { uk: 'Довжина корпусу', en: 'Hull length' };
                  if (key === 'ft') label = { uk: 'Час у морі', en: 'Time at sea' };
                  if (key === 'h') label = { uk: 'Висота над водою', en: 'Height above water' };
                }
                if (isGround) {
                  if (key === 'r') label = { uk: 'Запас ходу', en: 'Range (endurance)' };
                  if (key === 'kn') label = { uk: 'Вантажопідйомність', en: 'Payload capacity' };
                  if (key === 'zm') label = { uk: 'Маса', en: 'Weight' };
                  if (key === 'w') label = { uk: 'Тип шасі', en: 'Chassis type' };
                  if (key === 'l') label = { uk: 'Габарити (Д×Ш×В)', en: 'Dimensions (L×W×H)' };
                  if (key === 'ft') label = { uk: 'Дальність зв\'язку', en: 'Comm range' };
                  if (key === 'h') label = { uk: 'Кліренс', en: 'Ground clearance' };
                }

                changedFields.push(label);
                processedPairs.add(key);
                processedPairs.add(enKey);
                return;
              }

              // Змінився ТІЛЬКИ базовий
              let label = baseFieldNames[key] || { uk: key, en: key };
              
              if (isMarine) {
                if (key === 'r') label = { uk: 'Радіус дії', en: 'Radius of action' };
                if (key === 'kn') label = { uk: 'Бойова частина', en: 'Warhead' };
                if (key === 'zm') label = { uk: 'Водотоннажність', en: 'Displacement' };
                if (key === 'w') label = { uk: 'Ширина / Осадка', en: 'Beam / Draft' };
                if (key === 'l') label = { uk: 'Довжина корпусу', en: 'Hull length' };
                if (key === 'ft') label = { uk: 'Час у морі', en: 'Time at sea' };
                if (key === 'h') label = { uk: 'Висота над водою', en: 'Height above water' };
              }
              if (isGround) {
                if (key === 'r') label = { uk: 'Запас ходу', en: 'Range (endurance)' };
                if (key === 'kn') label = { uk: 'Вантажопідйомність', en: 'Payload capacity' };
                if (key === 'zm') label = { uk: 'Маса', en: 'Weight' };
                if (key === 'w') label = { uk: 'Тип шасі', en: 'Chassis type' };
                if (key === 'l') label = { uk: 'Габарити (Д×Ш×В)', en: 'Dimensions (L×W×H)' };
                if (key === 'ft') label = { uk: 'Дальність зв\'язку', en: 'Comm range' };
                if (key === 'h') label = { uk: 'Кліренс', en: 'Ground clearance' };
              }

              changedFields.push(label);
              processedPairs.add(key);
            });

            if (changedFields.length > 0) {
              updated.push({
                name: newD.n || newD.nr || newD.id,
                fields: changedFields
              });
            }
          });

          const newVersion = newData.version || '?';
          const oldVersion = oldData.version || '?';
          const versionChanged = newVersion !== oldVersion;

          if (added.length === 0 && removed.length === 0 && updated.length === 0 && !versionChanged) {
            console.log('ℹ️ Змін у data.json немає — history.json не оновлюємо');
            process.exit(0);
          }

          let existingEntry = historyFile.history.find(h => h.version === newVersion);
          
          if (existingEntry) {
            console.log(`📝 Дописуємо зміни до існуючої версії ${newVersion}`);
            
            added.forEach(name => {
              if (!existingEntry.added.includes(name)) existingEntry.added.push(name);
            });
            
            removed.forEach(name => {
              if (!existingEntry.removed.includes(name)) existingEntry.removed.push(name);
            });
            
            updated.forEach(newUpdate => {
              const existingUpdate = existingEntry.updated.find(u => u.name === newUpdate.name);
              if (existingUpdate) {
                newUpdate.fields.forEach(field => {
                  const exists = existingUpdate.fields.some(f => f.uk === field.uk);
                  if (!exists) existingUpdate.fields.push(field);
                });
              } else {
                existingEntry.updated.push(newUpdate);
              }
            });
            
            existingEntry.date = new Date().toISOString();
            
            if (versionChanged) {
              existingEntry.versionChange = {
                from: oldVersion,
                to: newVersion
              };
            }
          } else {
            console.log(`🆕 Створюємо новий запис для версії ${newVersion}`);
            historyFile.history.unshift({
              date: new Date().toISOString(),
              version: newVersion,
              added: added,
              removed: removed,
              updated: updated,
              versionChange: {
                from: oldVersion,
                to: newVersion
              }
            });
          }

          if (historyFile.history.length > 200) {
            historyFile.history = historyFile.history.slice(0, 200);
          }

          fs.writeFileSync('history.json', JSON.stringify(historyFile, null, 2));
          console.log('✅ history.json оновлено');
          console.log(`   Додано: ${added.length}, Видалено: ${removed.length}, Оновлено: ${updated.length}`);
          console.log(`   Версія: ${oldVersion} → ${newVersion}`);
          EOF

      - name: Commit history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --staged --quiet; then
            echo "ℹ️ Немає змін для коміту"
          else
            git commit -m "🤖 Auto-update history.json"
            git push
            echo "✅ history.json закомічено"
          fi
